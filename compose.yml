services:
  dashboard:
    image: ghcr.io/markis/hass-dashboard:latest
    container_name: hass-dashboard
    build:
      context: .
      dockerfile: Containerfile
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./output:/output
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    pids_limit: 512
    shm_size: 512m
    healthcheck:
      test: ["/app/scripts/healthcheck.sh", "--config", "/app/config.yaml"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
