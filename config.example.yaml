# Dashboard Configuration

google:
  # Path to a Google service account key JSON file. Create a service account
  # in Google Cloud, enable the Google Calendar API, and download the key.
  # In a Workspace domain, authorize the service account's client ID in the
  # Admin console (Security > API Controls > Domain-wide Delegation) for the
  # https://www.googleapis.com/auth/calendar.readonly scope.
  credentials_file: "credentials.json"
  # Workspace user email whose calendars the service account impersonates.
  # Required when using domain-wide delegation; the user must have access to the
  # calendars listed below.
  impersonate: "you@example.com"
  # Calendar IDs to display. Use "primary" for the impersonated user's primary
  # calendar, or the calendar's email address (found in Calendar settings).
  calendars:
    - primary
    - family@example.com
    - holidays@group.v.calendar.google.com

openweathermap:
  # API key from OpenWeatherMap
  # Get one at: https://openweathermap.org/api
  api_key: "your-openweathermap-api-key"
  # Coordinates for weather data
  latitude: 40.7128
  longitude: -74.0060

output:
  # Path to save the generated dashboard image
  path: "output.jpg"
  # Image dimensions in pixels
  width: 820
  height: 1200
  # Rotation in degrees (0, 90, 180, 270)
  rotate: 270

# Timezone for date/time display (IANA timezone name)
timezone: "America/New_York"

# How often to regenerate the dashboard (in seconds)
refresh_interval: 600
