# Dependabot version updates:
# files regular update PRs for Go modules, GitHub Actions, and container
# base images (Containerfile) from registry tags.
version: 2
updates:
  # Go module dependencies (go.mod / go.sum)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Minor + patch bumps are grouped into a single PR to limit noise;
    # major updates still get their own PR.
    groups:
      go-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # GitHub Actions workflows (.github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Container base images (Containerfile; matches Dockerfile/Containerfile
  # and image refs in YAML manifests)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"