# Auto-merge Dependabot pull requests.
#
# Dependabot-triggered workflows run fork-like: they get a read-only
# GITHUB_TOKEN and no Actions secrets, but the permissions key below
# raises the token scope (see "Troubleshooting Dependabot on GitHub
# Actions" in the GitHub docs).
#
# 'gh pr merge --auto' queues the PR; GitHub merges it (squash) once
# the required 'lint' and 'docker' status checks on main pass. A
# failing required check cancels the queued auto-merge and leaves the
# PR open for review.
name: "dependabot auto-merge"

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: automerge
    runs-on: ubuntu-latest
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.repository == 'markis/hass-dashboard'
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: gh pr merge --auto --squash "${PR_URL}"